[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-data-service"
version = "0.1.0"
description = "Stock market data management and ETL service for instruments, historical candles, profiles, and financial statements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pymysql>=1.1.0",
    "pymongo>=4.6.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "polars>=0.20.0",
    "pandas>=2.1.0",
    "ijson>=3.2.0",
    "requests>=2.31.0",
    "alembic>=1.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["unit_tests"]

[tool.ruff]
line-length = 100
target-version = "py311"